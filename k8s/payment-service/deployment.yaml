apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: polyglot-commerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: payment-service:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8085
              name: http
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: PAYMENT_DB_URL
              value: "Host=postgres;Port=5432;Database=payment_db;Username=$(DB_USER);Password=$(DB_PASSWORD)"
            - name: ORDER_URL
              value: "http://order-service:8084"
            - name: INVENTORY_URL
              value: "http://inventory-service:8083"
            - name: NOTIFICATION_URL
              value: "http://notification-service:8086"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8085
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8085
            initialDelaySeconds: 40
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: polyglot-commerce
spec:
  type: ClusterIP
  selector:
    app: payment-service
  ports:
    - port: 8085
      targetPort: 8085
      name: http
