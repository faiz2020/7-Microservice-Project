apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: polyglot-commerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: polyglot-frontend:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 5173
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: polyglot-commerce
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 5173
      targetPort: 5173
      name: http
