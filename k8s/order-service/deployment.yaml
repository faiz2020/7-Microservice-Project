apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: polyglot-commerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: order-service:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8084
              name: http
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: ORDER_DB_DSN
              value: "dbname=order_db user=$(DB_USER) password=$(DB_PASSWORD) host=postgres port=5432"
            - name: CATALOG_URL
              value: "http://catalog-service:8082"
            - name: INVENTORY_URL
              value: "http://inventory-service:8083"
            - name: NOTIFICATION_URL
              value: "http://notification-service:8086"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 40
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: polyglot-commerce
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - port: 8084
      targetPort: 8084
      name: http
