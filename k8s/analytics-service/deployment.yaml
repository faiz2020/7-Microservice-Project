apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: polyglot-commerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      containers:
        - name: analytics-service
          image: analytics-service:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8087
              name: http
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: ANALYTICS_DB_DSN
              value: "pgsql:host=postgres;port=5432;dbname=analytics_db"
            - name: CATALOG_URL
              value: "http://catalog-service:8082"
            - name: INVENTORY_URL
              value: "http://inventory-service:8083"
            - name: ORDER_URL
              value: "http://order-service:8084"
            - name: PAYMENT_URL
              value: "http://payment-service:8085"
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8087
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8087
            initialDelaySeconds: 40
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: polyglot-commerce
spec:
  type: ClusterIP
  selector:
    app: analytics-service
  ports:
    - port: 8087
      targetPort: 8087
      name: http
