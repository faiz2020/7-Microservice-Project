apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: polyglot-commerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: notification-service:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8086
              name: http
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: NOTIFICATION_DB_URL
              value: "postgres://$(DB_USER):$(DB_PASSWORD)@postgres:5432/notification_db"
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8086
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8086
            initialDelaySeconds: 40
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: polyglot-commerce
spec:
  type: ClusterIP
  selector:
    app: notification-service
  ports:
    - port: 8086
      targetPort: 8086
      name: http
