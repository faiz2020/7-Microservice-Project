apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: polyglot-commerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: inventory-service:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8083
              name: http
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: INVENTORY_DB_URL
              value: "postgres://$(DB_USER):$(DB_PASSWORD)@postgres:5432/inventory_db"
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: polyglot-commerce
spec:
  type: ClusterIP
  selector:
    app: inventory-service
  ports:
    - port: 8083
      targetPort: 8083
      name: http
